name: update profile art

on:
  schedule:
    - cron: "17 6 * * *"  # daily, ~1am Minneapolis
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/update-profile-art.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contributions and render SVGs
        run: |
          python scripts/fetch_contributions.py ${{ github.repository_owner }}
          python scripts/render_heatmap_svg.py
          python scripts/render_stats_svg.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contrib.json contrib-heatmap.svg stats.svg
          git diff --cached --quiet || { git commit -m "chore: refresh profile art"; git push; }
